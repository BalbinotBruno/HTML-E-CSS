<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinando Flexbox</title>

    <style>
        * {
            margin: 0px;
            padding: 0px;

        }


        nav {
            width: 100%;
            display: flex;
            position: relative;
            background-color: green;
        }

        .links {
            background-color: red;
            width: 100%;
            display: flex;
            justify-content: flex-end;

        }

        div {
            display: flex;
        }

        a {
            padding: 5px;
            display: flex;

            color: aqua;
            flex-flow: row;
            background-color: black;

            text-decoration: none;


        }
    </style>

</head>


<body>
    <nav class="navbar">
        <h2>MeuSite</h2>

        <div class="links">
            <a href="#">Início</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
        </div>
    </nav>

</body>

</html>
