<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox 002</title>
    <style>
        * {
            border: 0px;
            padding: 0px;
        }

        body>div {
            display: flex;
        }

        div.toolbar {
            justify-content: space-evenly;
            width: 100%;
            background-color: red;
            padding: 10px;
        }

        .logo {
            flex-shrink: 0;
            flex-grow: 0;
            width: 200px;
            height: 200px;
            background-color: blue;
            align-content: center;
            text-align: center;

        }

        .search {
            flex-shrink: 1;
            flex-grow: 1;

            background-color: green;
            width: 200px;
            height: 200px;

            align-content: center;
            text-align: center;
        }

        .notify{
            height: 200px;
            width: 200px;
            background-color: black;

            flex-shrink: 1;
            flex-grow: 0;

            align-content: center;
            text-align: center;
        }

        .avatar{
            height: 200px;
            width: 200px;
            background-color: brown;

            align-content: center;
            text-align: center;

             flex-shrink: 0;
            flex-grow: 0;


        }


        


        
    </style>
</head>

<body>
    <div class="toolbar">
        <div class="logo">🚀 Logo</div>
        <div class="search">🔍 Pesquisar...</div>
        <div class="notify">🔔</div>
        <div class="avatar">👤</div>
    </div>

</body>

</html>
