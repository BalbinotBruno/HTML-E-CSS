<html lang="ept-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 500px;
            border-collapse: collapse;
            position: relative;
        }
   
        td, th{
            border: 1px solid black;
            padding: 10px;
        }
        caption{
            font-size: 1em;
            font-weight: bold;
            padding: 10px;
            background-color: lightslategray;
        } 

        thead, tfoot{
            background-color: gray;
        }

        thead>tr > th{
            position: sticky;
            top: -1px;
            background-color: gray;
        }
        tbody > tr:nth-child(even){
            background-color: lightgrey;
        }

        td.num{
            text-align: right;
        }
    </style>
</head>
<body>
    <table>
        <caption>Populacao das Unidades Federativas</caption>
        <thead>
            <th scope="col">Estado</th>
            <th scope="col" style="width: 50px;">Populacao</th>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">45 448 888</td>
            </tr>
            <tr>
                <td>Minas Gerais</th>
                <td class="num">2828</td>
            </tr>
            <tr>
                <td>Santa Castarina</td>
                <td class="num">4444</td>
            </tr>
        </tbody>
        <tfoot>
            <th>Total de Habitantes</th>
            <td class="num">22225225612</td>
        </tfoot>
        
    </table>
</body>
</html>
